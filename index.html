<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CITODOMUS 3D-Hauskonfigurator – In 6 Monaten zuhause</title>
    <meta
      name="description"
      content="Konfiguriere dein modulares CITODOMUS-Haus in 5 Schritten – Modell, Fassade, Dach & Solar, Ausstattung – mit 3D-Ansicht, Grundriss und Live-Festpreis."
    />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      /* Ladezustand bis das Bundle gestartet ist (verhindert leeren Bildschirm) */
      body {
        margin: 0;
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #56423c;
        font: 600 14px/1.4 system-ui, sans-serif;
      }
      .boot b {
        display: block;
        color: #9d3e1a;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><div><b>CITODOMUS</b>3D-Hauskonfigurator wird geladen …</div></div>
    </div>
    <div id="print-root" class="print-only" aria-hidden="true"></div>
    <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Der CITODOMUS-Konfigurator benötigt JavaScript. Bitte aktiviere JavaScript oder kontaktiere uns direkt.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
